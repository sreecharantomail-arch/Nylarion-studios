services:
  - type: web
    name: nylarion-studios
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1

